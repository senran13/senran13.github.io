baseURL = "https://www.zongkunchang.com/"
locale = "zh-TW"
title = "Chang Zong-Kun"
disableKinds = ["taxonomy", "term", "rss"]

[params]
description = "Chang Zong-Kun (張宗坤) — historian of Cold War Taiwan, labor, and infrastructure. PhD student, SRCS, National Yang Ming Chiao Tung University."

# 允許內容檔使用 HTML（About Me、系列首頁的 12 欄格線）
[markup.goldmark.renderer]
unsafe = true
# 允許在段落、清單後一行以 {.class} 指定樣式
[markup.goldmark.parser.attribute]
block = true

